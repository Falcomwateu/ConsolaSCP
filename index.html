<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terminal de la Fundación SCP</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#000;--panel:#0d0d0d;--fg:#f2f2f2;--dim:#9a9a9a;--line:#444;--bar:#f2f2f2;--bar-ink:#000;--inv:none}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--panel:#f2f2f2;--fg:#0a0a0a;--dim:#5e5e5e;--line:#b5b5b5;--bar:#0a0a0a;--bar-ink:#fff;--inv:invert(1)}}
:root[data-theme="dark"]{--bg:#000;--panel:#0d0d0d;--fg:#f2f2f2;--dim:#9a9a9a;--line:#444;--bar:#f2f2f2;--bar-ink:#000;--inv:none}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:15px/1.55 ui-monospace,Menlo,Consolas,"Courier New",monospace}
.wrap{max-width:780px;margin:0 auto;padding:16px}
.hdr{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:bold;letter-spacing:.12em}
.brand img{width:42px;height:42px;filter:var(--inv)}
.dim{color:var(--dim)}
.rol{font-weight:normal;font-size:.75em;letter-spacing:.1em;color:var(--dim);border:1px solid var(--line);display:inline-block;padding:0 6px;margin-top:3px}
.chk{display:flex;gap:8px;align-items:center;margin:0 0 6px}.chk input{width:auto;margin:0}
h1,h2{font-size:1.05em;margin:0 0 8px;letter-spacing:.08em}
input,select,textarea,button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:9px 11px;border-radius:2px;width:100%;margin:4px 0 12px}
textarea{min-height:110px;resize:vertical}
button{cursor:pointer;text-align:left}button:hover,.item:hover{border-color:var(--fg)}
.sm{width:auto;display:inline-block;margin:0 6px 8px 0;padding:6px 10px}
.item{display:block;border:1px solid var(--line);background:var(--panel);padding:12px;margin:0 0 10px;cursor:pointer}
.item small{color:var(--dim);display:block}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);padding:8px 10px;margin:0 0 8px;flex-wrap:wrap}
.sec{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:0 0 16px}
.sec h2{color:var(--dim)}
.red{background:var(--bar);color:var(--bar-ink);padding:0 3px;font-weight:bold;white-space:nowrap}
.deny{border:1px dashed var(--fg);padding:10px;text-align:center;font-weight:bold}
.err{min-height:1.5em;font-weight:bold}
.tag{display:inline-block;border:1px solid var(--fg);padding:0 8px;margin-left:6px}
.logo{text-align:center;margin:8px 0 18px}.logo img{width:130px;height:130px;filter:var(--inv)}
.logo div{letter-spacing:.3em;font-size:.8em;color:var(--dim)}
.edsec{border:1px solid var(--line);padding:10px 10px 0;margin:0 0 12px}
label{color:var(--dim);font-size:.9em}
@keyframes bl{50%{opacity:0}}.cur{animation:bl 1s steps(1) infinite}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ===== DATOS POR DEFECTO (el DM puede editarlos desde el panel O5-1) ===== */
var ADMIN={id:"O5-1",h:5498095336964385,nombre:"Consejo O5",nivel:5,rol:"Administrador"};
var DEF={users:{"AGENTE-001":{h:8007628441075310,nombre:"Personal de Sitio-19",nivel:2,rol:"Investigador",scps:null}},scps:{
"SCP-173":{clase:"Euclid",nombre:"La Escultura",secciones:[
 {n:1,t:"Procedimientos especiales de contención",x:"El objeto se mantiene siempre dentro de un contenedor cerrado con llave. Al entrar, deben ser al menos {{3}} personas y la puerta se vuelve a cerrar tras ellas. En todo momento, dos personas mantienen contacto visual directo con el objeto hasta que todo el personal haya salido y el contenedor esté de nuevo cerrado."},
 {n:1,t:"Descripción",x:"Trasladado al Sitio-19 en 1993. Origen desconocido. Está hecho de hormigón y varilla, con restos de pintura en aerosol. Es un objeto animado y extremadamente hostil. No puede moverse mientras esté en línea de visión directa, y esa línea no debe romperse nunca. El personal asignado debe avisar a sus compañeros antes de parpadear. Ataca rompiendo el cuello en la base del cráneo o por estrangulamiento. Dentro del contenedor se oyen a veces sonidos de piedra raspando cuando no hay nadie; se considera normal, pero cualquier cambio debe reportarse al supervisor de turno."},
 {n:2,t:"Mantenimiento del recinto",x:"El suelo presenta una sustancia rojiza de origen {{desconocido}}. El recinto debe limpiarse cada dos semanas."},
 {n:3,t:"Registro de incidentes",x:"[Contenido reservado]"}]},
"SCP-027":{clase:"Keter",nombre:"El Dios de las Alimañas",secciones:[
 {n:1,t:"Procedimientos especiales de contención",x:"El huésped actual (sujeto 027-02) permanece en una celda de 5 m x 5 m con suelo elevado de rejilla conectado a un potente sistema de vacío. El sujeto debe estar vigilado por al menos dos miembros del personal en todo momento."},
 {n:2,t:"Descripción",x:"Fenómeno de origen desconocido ligado a un solo sujeto humano a la vez. El huésped está siempre rodeado de enjambres de alimañas atraídas hacia él. No puede controlarlas y a veces es atacado por ejemplares salvajes. Estas criaturas también atacan a quien se acerque demasiado. Se sabe que el fenómeno ha cambiado de huésped al menos una vez, tras la muerte del primero, y es probable que lo haya hecho {{varias veces antes de su contención}}. Todo personal de alto valor debe mantenerse lejos del huésped actual. Aún se desconoce cómo atrae a los animales o qué es realmente."},
 {n:3,t:"Entrevistas y registros del sujeto",x:"[Contenido reservado]"}]},
"SCP-6096":{clase:"Keter",nombre:"El Huésped",secciones:[
 {n:1,t:"Procedimientos especiales de contención",x:"La entidad se mantiene en una cámara estándar de contención humanoide en el Sitio-19 y debe ser liberada cuando ella lo desee. Está prohibido atacarla, ordenar o engañar a otros para que la ataquen, tenderle trampas, construir dispositivos que la dañen y retirarle la sábana."},
 {n:2,t:"Descripción",x:"Entidad de forma humanoide cuyo cuerpo está siempre oculto bajo una gran sábana de algodón. Periódicamente se activa y camina hacia un objetivo {{elegido al azar entre toda la población terrestre}}. Quienes estén cerca no pueden impedir su avance. Al alcanzar al objetivo, lo arrastra bajo la sábana y lo hace desaparecer lentamente, en unos {{20 a 40 minutos}}; después vuelve a un estado dócil."},
 {n:3,t:"Adenda: contención inicial y aviso de bienvenida",x:"[Contenido reservado]"}]}
}};
/* ===== FIN DATOS ===== */

var KEY="scp_terminal_v1",app=document.getElementById("app"),ses=null,ed=null;
function H(s){var h1=0xdeadbeef,h2=0x41c6ce57,c;s="scp:"+s;for(var i=0;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
var REMOTE=JSON.parse(JSON.stringify(DEF)),D=REMOTE;
function borrador(){try{var t=localStorage.getItem(KEY);if(t){var d=JSON.parse(t);if(d&&d.users&&d.scps)return d}}catch(e){}return null}
function guardar(){if(ses&&ses.admin)try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function permitido(k){return ses.admin||ses.scps==null||ses.scps.indexOf(k)>-1}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function $(i){return document.getElementById(i)}
function censura(s,n){return esc(s).replace(/\{\{(.+?)\}\}/g,function(m,a){return '<span class="red" title="DATOS ELIMINADOS">'+(n>=3?a:"█".repeat(Math.max(4,Math.min(a.length,14))))+'</span>'})}

/* ===== SONIDO (Web Audio, sin archivos externos) ===== */
var snd={on:true,ctx:null};
function tono(f,d,tp,v,t0){if(!snd.on)return;try{snd.ctx=snd.ctx||new(window.AudioContext||window.webkitAudioContext)();var c=snd.ctx,o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(t0||0);
 o.type=tp||"square";o.frequency.value=f;g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d)}catch(e){}}
function sClick(){tono(1100,.04,"square",.04)}
function sKey(){tono(700+Math.random()*200,.02,"square",.025)}
function sOk(){tono(520,.12,"square",.05,0);tono(660,.12,"square",.05,.13);tono(880,.25,"square",.05,.26)}
function sNo(){tono(110,.35,"sawtooth",.07,0);tono(90,.35,"sawtooth",.07,.18)}
function sOpen(){tono(300,.05,"square",.04,0);tono(450,.05,"square",.04,.06)}
document.addEventListener("click",function(e){var m=e.target.closest("[data-music]");if(m){musToggle();m.textContent="MÚSICA: "+(mus.on?"ON":"OFF");sClick();return}
 var t=e.target.closest("[data-mute]");if(t){snd.on=!snd.on;t.textContent="SONIDO: "+(snd.on?"ON":"OFF");if(snd.on)sClick();return}
 if(e.target.closest("button,.item"))sClick()});
document.addEventListener("keydown",function(e){if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))sKey()});

/* ===== MÚSICA: si existe musica.mp3 junto a este archivo suena esa; si no, un ambiente generado ===== */
var mus={on:false,el:null,nodes:null};
function actx(){snd.ctx=snd.ctx||new(window.AudioContext||window.webkitAudioContext)();if(snd.ctx.state==="suspended")snd.ctx.resume();return snd.ctx}
function ambient(){if(mus.nodes||!mus.on)return;var c=actx(),m=c.createGain(),f=c.createBiquadFilter(),all=[];m.gain.value=0;f.type="lowpass";f.frequency.value=380;f.connect(m);m.connect(c.destination);
 [55,82.5,110.3,164.9].forEach(function(fr,i){var o=c.createOscillator(),g=c.createGain();o.type=i%2?"triangle":"sine";o.frequency.value=fr;o.detune.value=(i-1.5)*6;g.gain.value=.55/(i+1);o.connect(g);g.connect(f);o.start();all.push(o)});
 var l=c.createOscillator(),lg=c.createGain();l.frequency.value=.07;lg.gain.value=180;l.connect(lg);lg.connect(f.frequency);l.start();all.push(l);
 m.gain.linearRampToValueAtTime(.14,c.currentTime+3);mus.nodes={m:m,all:all,c:c}}
var mi=0,fails=0;
function pista(){if(!mus.on)return;var t=D.musica===undefined?["musica.mp3"]:D.musica;if(!t.length||fails>=t.length){fails=0;return ambient()}
 var a=new Audio(t[mi%t.length]);a.volume=(D.volumen==null?45:D.volumen)/100;mus.el=a;
 a.onended=function(){fails=0;mi++;pista()};a.onerror=function(){fails++;mi++;pista()};var p=a.play();if(p&&p.catch)p.catch(function(){})}
function musStart(){mus.on=true;mi=0;fails=0;pista()}
function musStop(){mus.on=false;try{if(mus.el){mus.el.onended=mus.el.onerror=null;mus.el.pause();mus.el=null}if(mus.nodes){var n=mus.nodes;n.m.gain.linearRampToValueAtTime(0,n.c.currentTime+1);setTimeout(function(){n.all.forEach(function(o){try{o.stop()}catch(e){}})},1200);mus.nodes=null}}catch(e){}}
function musToggle(){mus.on?musStop():musStart()}

function cab(){var g=ses?'BIENVENIDO/A, '+esc(ses.nombre.toUpperCase()):'FUNDACIÓN SCP';
 return '<div class="hdr"><div class="brand">'+LOGO+'<div><div>'+g+'</div>'+(ses&&ses.rol?'<div class="rol">'+esc(ses.rol.toUpperCase())+'</div>':'')+'</div></div><div class="dim">'+(ses?esc(ses.id)+' · NIVEL '+ses.nivel+' ':'')+'<button class="sm" data-mute="1">SONIDO: '+(snd.on?'ON':'OFF')+'</button><button class="sm" data-music="1">MÚSICA: '+(mus.on?'ON':'OFF')+'</button></div></div>'}

/* ===== LOGIN ===== */
function login(msg){
 D=REMOTE;app.innerHTML=cab()+'<div class="logo">'+LOGO+'<div>SECURE · CONTAIN · PROTECT</div></div><h1>AUTENTICACIÓN REQUERIDA</h1><p class="dim">Acceso restringido a personal autorizado. Los intentos fallidos quedan registrados.</p>'+
 '<label>ID de agente</label><input id="u" autocapitalize="characters" autocomplete="off"><label>Clave</label><input id="p" type="password" autocomplete="off">'+
 '<div class="err" id="e">'+esc(msg||"")+'</div><button id="go">&gt; INGRESAR<span class="cur">_</span></button>';
 var go=function(){var u=$("u").value.trim().toUpperCase(),h=H($("p").value),c=(u===ADMIN.id)?ADMIN:D.users[u];
  if(c&&c.h===h){ses={id:u,nombre:c.nombre,nivel:c.nivel,ver:c.nivel,admin:u===ADMIN.id,rol:c.rol,scps:c.scps};if(ses.admin)D=borrador()||JSON.parse(JSON.stringify(REMOTE));sOk();indice()}else{sNo();login("ACCESO DENEGADO: credenciales inválidas.")}};
 $("go").onclick=go;$("p").onkeydown=function(e){if(e.key==="Enter")go()};
}

/* ===== ÍNDICE Y DOCUMENTOS ===== */
function indice(){
 var h=cab()+'<h1>REGISTROS DISPONIBLES</h1>';var n0=0;
 Object.keys(D.scps).forEach(function(k){if(!permitido(k))return;n0++;var s=D.scps[k];h+='<a class="item" data-k="'+esc(k)+'"><b>'+esc(k)+'</b><span class="tag">'+esc(String(s.clase).toUpperCase())+'</span><small>'+esc(s.nombre)+'</small></a>'});
 if(!n0)h+='<p class="dim">No tienes registros asignados.</p>';
 if(ses.admin)h+='<button id="adm">&gt; PANEL DE ADMINISTRACIÓN O5</button>';
 h+='<button id="out">&lt; CERRAR SESIÓN</button>';app.innerHTML=h;
 document.querySelectorAll(".item").forEach(function(a){a.onclick=function(){sOpen();doc(a.dataset.k)}});
 if(ses.admin)$("adm").onclick=admin;$("out").onclick=function(){ses=null;login()};
}
function doc(k){
 if(!permitido(k)||!D.scps[k])return indice();
 var s=D.scps[k],n=ses.ver,h=cab()+'<button class="sm" id="b">&lt; ÍNDICE</button>';
 if(ses.admin){h+='<label>Ver como nivel:</label><select id="ver">'+[1,2,3,4,5].map(function(i){return '<option'+(i===n?' selected':'')+'>'+i+'</option>'}).join("")+'</select>'}
 h+='<h1>'+esc(k)+' — '+esc(s.nombre.toUpperCase())+'</h1><p>Clase de objeto: <span class="tag">'+esc(String(s.clase).toUpperCase())+'</span></p>';
 s.secciones.forEach(function(c){h+='<div class="sec"><h2>'+esc(String(c.t).toUpperCase())+'</h2>'+(n>=c.n?'<div>'+censura(c.x,n)+'</div>':'<div class="deny">ACCESO DENEGADO — SE REQUIERE AUTORIZACIÓN DE NIVEL '+c.n+'</div>')+'</div>'});
 app.innerHTML=h;window.scrollTo(0,0);$("b").onclick=indice;
 if(ses.admin)$("ver").onchange=function(){ses.ver=+this.value;doc(k)};
}

/* ===== PANEL DE ADMINISTRACIÓN ===== */
function opts(sel,arr){return arr.map(function(v){return '<option'+(String(v)===String(sel)?' selected':'')+'>'+esc(v)+'</option>'}).join("")}
function admin(){
 app.innerHTML=cab()+'<h1>PANEL O5</h1><p class="dim">Tus cambios son un borrador que solo ves tú en este navegador. Para publicarlos: EXPORTAR y pega el texto en data.json de tu repositorio de GitHub.</p>'+
 '<button id="a1">&gt; PERFILES Y CLAVES</button><button id="a2">&gt; ARCHIVOS SCP</button><button id="a3">&gt; EXPORTAR / IMPORTAR</button><button id="a4">&gt; DESCARTAR BORRADOR (VOLVER A LO PUBLICADO)</button><button id="a6">&gt; MÚSICA DE FONDO</button><button id="a5">&lt; VOLVER</button>';
 $("a1").onclick=function(){adminUsers()};$("a2").onclick=adminScps;$("a3").onclick=adminIO;$("a6").onclick=function(){adminMus()};$("a5").onclick=indice;
 $("a4").onclick=function(){if(confirm("¿Descartar tu borrador y volver a los datos publicados?")){try{localStorage.removeItem(KEY)}catch(e){}D=JSON.parse(JSON.stringify(REMOTE));sOk();admin()}};
}
function adminUsers(edit,msg){
 var u=edit?D.users[edit]:null,h=cab()+'<button class="sm" id="b">&lt; PANEL</button><h1>PERFILES</h1>';
 Object.keys(D.users).forEach(function(k){var x=D.users[k];h+='<div class="row"><span><b>'+esc(k)+'</b> · '+esc(x.nombre)+' · '+esc(x.rol||"sin rol")+' · nivel '+x.nivel+' · '+(x.scps==null?'todos los SCP':x.scps.length+' SCP')+'</span><span><button class="sm" data-e="'+esc(k)+'">EDITAR</button><button class="sm" data-d="'+esc(k)+'">BORRAR</button></span></div>'});
 h+='<h2>'+(u?'EDITAR '+esc(edit):'NUEVO PERFIL')+'</h2><label>ID</label><input id="ui" value="'+esc(edit||"")+'"><label>Nombre / cargo</label><input id="un" value="'+esc(u?u.nombre:"")+'"><label>Rol (etiqueta bajo su nombre)</label><input id="ur" list="roles" value="'+esc(u?u.rol||"":"")+'"><datalist id="roles"><option value="Investigador"><option value="Científico"><option value="Miembro del personal de seguridad"><option value="Miembro del cuerpo de tareas móviles"><option value="Clase D"><option value="Médico"><option value="Ingeniero"><option value="Administrativo"></datalist><label>Nivel de autorización</label><select id="ul">'+opts(u?u.nivel:2,[1,2,3,4,5])+'</select><label>SCPs que puede ver</label><div class="chk"><input type="checkbox" id="uall"'+(!u||u.scps==null?' checked':'')+'><span>Todos (incluidos los que añada después)</span></div>'+Object.keys(D.scps).map(function(k){return '<div class="chk"><input type="checkbox" class="sc" value="'+esc(k)+'"'+(!u||u.scps==null||u.scps.indexOf(k)>-1?' checked':'')+'><span>'+esc(k)+' · '+esc(D.scps[k].nombre)+'</span></div>'}).join("")+'<label>Clave'+(u?' (déjala vacía para no cambiarla)':'')+'</label><input id="uc" autocomplete="off"><div class="err">'+esc(msg||"")+'</div><button id="sv">&gt; GUARDAR PERFIL</button>';
 app.innerHTML=h;$("b").onclick=admin;
 document.querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){adminUsers(b.dataset.e)}});
 document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){if(confirm("¿Borrar "+b.dataset.d+"?")){delete D.users[b.dataset.d];guardar();adminUsers()}}});
 $("sv").onclick=function(){var id=$("ui").value.trim().toUpperCase(),c=$("uc").value;
  if(!id)return adminUsers(edit,"Falta el ID.");if(id===ADMIN.id)return adminUsers(edit,"Ese ID está reservado.");
  if(id!==edit&&D.users[id])return adminUsers(edit,"Ya existe ese ID.");if(!u&&!c)return adminUsers(edit,"Falta la clave.");
  var rec={nombre:$("un").value.trim()||id,rol:$("ur").value.trim(),nivel:+$("ul").value,scps:$("uall").checked?null:Array.prototype.map.call(document.querySelectorAll(".sc:checked"),function(x){return x.value}),h:c?H(c):u.h};if(edit&&id!==edit)delete D.users[edit];D.users[id]=rec;guardar();sOk();adminUsers()};
}
function adminScps(){
 var h=cab()+'<button class="sm" id="b">&lt; PANEL</button><h1>ARCHIVOS SCP</h1>';
 Object.keys(D.scps).forEach(function(k){h+='<div class="row"><span><b>'+esc(k)+'</b> · '+esc(D.scps[k].nombre)+'</span><span><button class="sm" data-e="'+esc(k)+'">EDITAR</button><button class="sm" data-d="'+esc(k)+'">BORRAR</button></span></div>'});
 h+='<button id="nw">&gt; NUEVO ARCHIVO</button>';app.innerHTML=h;$("b").onclick=admin;
 $("nw").onclick=function(){ed={k0:null,k:"SCP-",nombre:"",clase:"Euclid",secs:[{n:1,t:"Descripción",x:""}]};editScp()};
 document.querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){var s=D.scps[b.dataset.e];ed={k0:b.dataset.e,k:b.dataset.e,nombre:s.nombre,clase:s.clase,secs:JSON.parse(JSON.stringify(s.secciones))};editScp()}});
 document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){if(confirm("¿Borrar "+b.dataset.d+"?")){delete D.scps[b.dataset.d];guardar();adminScps()}}});
}
function readEd(){ed.k=$("ek").value.trim();ed.nombre=$("en").value;ed.clase=$("ec").value;ed.secs=ed.secs.map(function(s,i){return{n:+$("sn"+i).value,t:$("st"+i).value,x:$("sx"+i).value}})}
function editScp(msg){
 var h=cab()+'<button class="sm" id="b">&lt; ARCHIVOS</button><h1>EDITAR ARCHIVO</h1><p class="dim">En el texto, escribe {{así}} lo que quieras tachar para niveles menores a 3.</p>'+
 '<label>Número (ej. SCP-173)</label><input id="ek" value="'+esc(ed.k)+'"><label>Nombre</label><input id="en" value="'+esc(ed.nombre)+'"><label>Clase</label><select id="ec">'+opts(ed.clase,["Safe","Euclid","Keter","Thaumiel","Apollyon"])+'</select>';
 ed.secs.forEach(function(s,i){h+='<div class="edsec"><label>Título</label><input id="st'+i+'" value="'+esc(s.t)+'"><label>Nivel mínimo para verla</label><select id="sn'+i+'">'+opts(s.n,[1,2,3,4,5])+'</select><label>Texto</label><textarea id="sx'+i+'">'+esc(s.x)+'</textarea><button class="sm" data-r="'+i+'">QUITAR SECCIÓN</button></div>'});
 h+='<button id="ad">+ AÑADIR SECCIÓN</button><div class="err">'+esc(msg||"")+'</div><button id="sv">&gt; GUARDAR ARCHIVO</button>';app.innerHTML=h;
 $("b").onclick=adminScps;$("ad").onclick=function(){readEd();ed.secs.push({n:2,t:"Nueva sección",x:""});editScp()};
 document.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){readEd();ed.secs.splice(+b.dataset.r,1);editScp()}});
 $("sv").onclick=function(){readEd();if(!ed.k)return editScp("Falta el número.");if(ed.k!==ed.k0&&D.scps[ed.k])return editScp("Ya existe ese número.");
  if(ed.k0&&ed.k!==ed.k0)delete D.scps[ed.k0];D.scps[ed.k]={clase:ed.clase,nombre:ed.nombre,secciones:ed.secs};guardar();sOk();adminScps()};
}
function adminMus(msg){
 var t=D.musica===undefined?["musica.mp3"]:D.musica,v=D.volumen==null?45:D.volumen;
 app.innerHTML=cab()+'<button class="sm" id="b">&lt; PANEL</button><h1>MÚSICA DE FONDO</h1><p class="dim">GitHub no permite subir archivos desde esta página. Sube tus mp3 al repositorio (junto a index.html) y escribe aquí sus nombres, uno por línea, por ejemplo <b>musica.mp3</b> o <b>audio/tema1.mp3</b>. También sirven enlaces directos https:// a un audio. Suenan en orden y en bucle. Si dejas la lista vacía, suena el ambiente generado.</p><label>Pistas (una por línea)</label><textarea id="mt">'+esc(t.join("\n"))+'</textarea><label>Volumen: <span id="mv">'+v+'</span>%</label><input id="vol" type="range" min="0" max="100" value="'+v+'"><div class="err">'+esc(msg||"")+'</div><button id="ms">&gt; GUARDAR MÚSICA</button><p class="dim">Después de guardar, pulsa el botón MÚSICA de arriba para probarla. Para publicarla a todos, usa Exportar y pega el texto en data.json.</p>';
 $("b").onclick=admin;$("vol").oninput=function(){$("mv").textContent=this.value};
 $("ms").onclick=function(){var on=mus.on;musStop();D.musica=$("mt").value.split("\n").map(function(x){return x.trim()}).filter(Boolean);D.volumen=+$("vol").value;guardar();if(on)musStart();sOk();adminMus("Música guardada en tu borrador.")};
}
function adminIO(msg){
 app.innerHTML=cab()+'<button class="sm" id="b">&lt; PANEL</button><h1>EXPORTAR / IMPORTAR</h1><p class="dim">Copia este texto y pégalo en el archivo data.json de GitHub para publicar tus cambios a todos. Para cargar un respaldo en tu borrador, pégalo abajo.</p><label>Exportar</label><textarea id="ex" readonly>'+esc(JSON.stringify(D))+'</textarea><label>Importar</label><textarea id="im"></textarea><div class="err">'+esc(msg||"")+'</div><button id="ib">&gt; IMPORTAR</button>';
 $("b").onclick=admin;$("ex").onclick=function(){this.select()};
 $("ib").onclick=function(){try{var d=JSON.parse($("im").value);if(!d.users||!d.scps)throw 0;D=d;guardar();sOk();adminIO("Importado correctamente.")}catch(e){sNo();adminIO("Formato inválido.")}};
}
(function(){var ok=function(){login()};try{fetch("data.json?"+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){if(d&&d.users&&d.scps)REMOTE=d;ok()}).catch(ok)}catch(e){ok()}})();
</script>
</body>
</html>
