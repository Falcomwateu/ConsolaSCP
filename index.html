<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:15px/1.55 ui-monospace,Menlo,Consolas,"Courier New",monospace}
.wrap{max-width:780px;margin:0 auto;padding:16px}
.hdr{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:bold;letter-spacing:.12em}
.brand img{width:42px;height:42px;filter:var(--inv)}
.dim{color:var(--dim)}
.rol{font-weight:normal;font-size:.75em;letter-spacing:.1em;color:var(--dim);border:1px solid var(--line);display:inline-block;padding:0 6px;margin-top:3px}
.chk{display:flex;gap:8px;align-items:center;margin:0 0 6px}.chk input{width:auto;margin:0}
h1,h2{font-size:1.05em;margin:0 0 8px;letter-spacing:.08em}
input,select,textarea,button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:9px 11px;border-radius:2px;width:100%;margin:4px 0 12px}
textarea{min-height:110px;resize:vertical}
button{cursor:pointer;text-align:left}button:hover,.item:hover{border-color:var(--fg)}
.sm{width:auto;display:inline-block;margin:0 6px 8px 0;padding:6px 10px}
.item{display:block;border:1px solid var(--line);background:var(--panel);padding:12px;margin:0 0 10px;cursor:pointer}
.item small{color:var(--dim);display:block}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);padding:8px 10px;margin:0 0 8px;flex-wrap:wrap}
.sec{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:0 0 16px}
.sec h2{color:var(--dim)}
.red{background:var(--bar);color:var(--bar-ink);padding:0 3px;font-weight:bold;white-space:nowrap}
.deny{border:1px dashed var(--fg);padding:10px;text-align:center;font-weight:bold}
.err{min-height:1.5em;font-weight:bold}
.tag{display:inline-block;border:1px solid var(--fg);padding:0 8px;margin-left:6px}
.logo{text-align:center;margin:8px 0 18px}.logo img{width:130px;height:130px;filter:var(--inv)}
.logo div{letter-spacing:.3em;font-size:.8em;color:var(--dim)}
.edsec{border:1px solid var(--line);padding:10px 10px 0;margin:0 0 12px}
label{color:var(--dim);font-size:.9em}
@keyframes bl{50%{opacity:0}}.cur{animation:bl 1s steps(1) infinite}
.wrap{padding-bottom:96px}
.msg{white-space:pre-wrap;border-left:2px solid var(--line);padding-left:12px}
audio{width:100%;margin:6px 0;filter:grayscale(1)}
.logo{perspective:700px}.spin{display:inline-block;animation:sp 4s linear infinite}
@keyframes sp{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.bar{height:6px;border:1px solid var(--line);margin:14px 0}.bar i{display:block;height:100%;width:0;background:var(--fg);transition:width .4s}
#bl{min-height:130px}#bl div{color:var(--dim)}
#badge{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;display:none;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel);padding:6px 8px;pointer-events:none;opacity:.92;max-width:62vw}
#badge img,#badge .ph{width:44px;height:52px;object-fit:cover;border:1px solid var(--line);flex:none;filter:grayscale(1) contrast(1.1)}
#badge .ph{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:1.3em}
#badge b{display:block;font-size:.8em;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#badge span{font-size:.7em;color:var(--dim)}
#crt{position:fixed;inset:0;pointer-events:none;z-index:50;display:none;overflow:hidden;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.3) 3px,rgba(0,0,0,0) 4px),radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%);animation:fl 5s infinite}
#crt::after{content:"";position:absolute;left:0;right:0;height:90px;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.06),rgba(255,255,255,0));animation:sc 7s linear infinite}
.crt #crt{display:block}
@keyframes fl{0%,100%{opacity:.9}48%{opacity:1}50%{opacity:.75}52%{opacity:1}}
@keyframes sc{from{top:-90px}to{top:100%}}
@media (prefers-reduced-motion:reduce){#crt,#crt::after,.spin{animation:none}}
.cur2{animation:bl 1.2s steps(1) infinite;letter-spacing:.25em}
input[type=color]{height:42px;padding:2px;cursor:pointer}
.load{text-align:center;margin-top:14vh}.load h1{font-size:1.4em;text-shadow:0 0 14px var(--c)}
.load #ll{text-align:left;max-width:440px;margin:14px auto;min-height:84px}
#badge,#badge img,#badge .ph{border-color:var(--pc,var(--line))}
#badge b{text-shadow:0 0 8px var(--pc,transparent)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:0 0 14px}
.cell{border:1px solid var(--line);background:var(--panel);padding:6px 8px;text-align:center}
.cell small{display:block;color:var(--dim);font-size:.68em;letter-spacing:.06em}.cell b{font-size:1.1em}.cell.big b{font-size:1.8em}
.sk{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding:3px 0}.sk i{font-style:normal;color:var(--dim)}
.tbl{overflow-x:auto;margin:0 0 12px}.tbl table{border-collapse:collapse;font-size:.8em;min-width:420px;width:100%}.tbl th,.tbl td{border:1px solid var(--line);padding:3px 6px;text-align:center}.tbl th{background:var(--panel)}
.fg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0 10px}.pip{letter-spacing:.15em}
</style>

/* ===== LOGIN ===== */
function login(msg){
 D=REMOTE;app.innerHTML=cab()+'<div class="logo">'+LOGO+'<div>SECURE · CONTAIN · PROTECT</div></div><h1>AUTENTICACIÓN REQUERIDA</h1><p class="dim">Acceso restringido a personal autorizado. Los intentos fallidos quedan registrados.</p>'+
 '<label>ID de agente</label><input id="u" autocapitalize="characters" autocomplete="off"><label>Clave</label><input id="p" type="password" autocomplete="off">'+
 '<div class="err" id="e">'+esc(msg||"")+'</div><button id="go">&gt; INGRESAR<span class="cur">_</span></button>';
 var go=function(){var u=$("u").value.trim().toUpperCase(),h=H($("p").value),c=(u===ADMIN.id)?ADMIN:D.users[u];
  if(c&&c.h===h){ses={id:u,nombre:c.nombre,nivel:c.nivel,ver:c.nivel,admin:u===ADMIN.id,rol:c.rol,docs:c.docs,foto:c.foto,color:c.color,g:jget("scp_g_"+u,{})};if(ses.admin)D=borrador()||JSON.parse(JSON.stringify(REMOTE));sOk();indice()}else{sNo();login("ACCESO DENEGADO: credenciales inválidas.")}};
 $("go").onclick=go;$("p").onkeydown=function(e){if(e.key==="Enter")go()};
}

/* ===== ÍNDICE, SECCIONES Y DOCUMENTOS ===== */
function indice(){
 var h=cab()+'<h1>SECCIONES</h1>',n0=0,nm=nuevos();
 h+='<a class="item" data-x="mail"><b>CORREO'+(nm?' ● '+nm:'')+'</b><small>'+(nm?nm+' mensaje(s) sin leer':'Sin mensajes nuevos')+'</small></a>';
 Object.keys(D.cats).forEach(function(c){var n=Object.keys(D.cats[c].docs).filter(function(k){return permitido(c,k)}).length;if(!n&&!ses.admin)return;n0++;
  h+='<a class="item" data-c="'+esc(c)+'"><b>'+esc(D.cats[c].nombre.toUpperCase())+'</b><small>'+n+' registro(s)</small></a>'});
 if(!n0)h+='<p class="dim">No tienes registros asignados.</p>';
 if(!ses.admin&&D.users[ses.id]&&D.users[ses.id].ficha)h+='<a class="item" data-x="ficha"><b>MI FICHA</b><small>Hoja de personaje</small></a>';
 if(!ses.admin)h+='<a class="item" data-x="auth"><b>AUTORIZACIONES</b><small>Solicitar acceso o introducir un código</small></a>';
 if(ses.admin)h+='<button id="adm">&gt; PANEL DE ADMINISTRACIÓN O5</button>';
 h+='<button id="out">&lt; CERRAR SESIÓN</button>';app.innerHTML=h;
 document.querySelectorAll(".item").forEach(function(a){a.onclick=function(){sOpen();if(a.dataset.x==="mail")correos();else if(a.dataset.x==="auth")autor();else if(a.dataset.x==="ficha")fichaVer(ses.id);else seccion(a.dataset.c)}});
 if(ses.admin)$("adm").onclick=admin;$("out").onclick=function(){ses=null;login()};
}
function seccion(c){
 if(!D.cats[c])return indice();var n=0,h=cab()+'<button class="sm" id="b">&lt; SECCIONES</button><h1>'+esc(D.cats[c].nombre.toUpperCase())+'</h1>';
 Object.keys(D.cats[c].docs).forEach(function(k){if(!permitido(c,k))return;n++;var s=D.cats[c].docs[k];
  h+='<a class="item" style="'+cs(s.clase)+'" data-k="'+esc(k)+'"><b>'+esc(k)+'</b>'+(s.clase?'<span class="tag" style="'+tg(s.clase)+'">'+esc(String(s.clase).toUpperCase())+'</span>':'')+'<small>'+esc(s.nombre)+'</small></a>'});
 if(!n)h+='<p class="dim">Sin registros en esta sección.</p>';
 app.innerHTML=h;$("b").onclick=indice;
 document.querySelectorAll(".item").forEach(function(a){a.onclick=function(){abrir(c,a.dataset.k)}});
}
/* ===== COLORES, CARGAS E INTRO ===== */
var DEFCOL={clases:{safe:"#5ee07a",euclid:"#ffd23f",keter:"#ff4040",thaumiel:"#4fa3ff",apollyon:"#ff7a00"},niveles:{1:"#8fd3ff",2:"#7dff9a",3:"#ffe066",4:"#ff9f43",5:"#ff4d4d"}};
function norm(x){return String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim()}
function cc(cl){var k=norm(cl);return(D.colores&&D.colores.clases&&D.colores.clases[k])||DEFCOL.clases[k]||""}
function cl(n){return(D.colores&&D.colores.niveles&&D.colores.niveles[n])||DEFCOL.niveles[n]||"#ffffff"}
function cs(x){var c=cc(x);return c?"border-left:4px solid "+c+";box-shadow:-3px 0 14px -5px "+c:""}
function tg(x){var c=cc(x);return c?"border-color:"+c+";color:"+c+";text-shadow:0 0 8px "+c:""}
function gl(x){var c=cc(x);return c?"text-shadow:0 0 12px "+c:""}
function bc(x){var c=cc(x);return c?"border-left-color:"+c:""}
function sClase(cn){if(!snd.on)return;
 if(cn==="keter"){[0,.45,.9].forEach(function(d){tono(110,.3,"sawtooth",.06,d);tono(165,.3,"sawtooth",.04,d)})}
 else if(cn==="euclid"){[0,.25,.5,.75].forEach(function(d,i){tono(420+i*60,.12,"square",.04,d)})}
 else if(cn==="safe"){tono(523,.2,"sine",.06,0);tono(784,.35,"sine",.06,.2)}
 else if(cn==="thaumiel"){[0,.2,.4,.6,.8,1,1.2].forEach(function(d,i){tono(330*Math.pow(1.2599,i),.45,"sine",.045,d)})}
